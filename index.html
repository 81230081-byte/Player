<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1f0d">
<meta name="description" content="تطبيق العادات الإسلامية - تتبع صلواتك، أذكارك، وعاداتك اليومية">

<title>عاداتي</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
<link rel="icon" type="image/png" href="assets/icons/icon-72x72.png">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
    :root {
        --bg-primary: #0d1f0d;
        --bg-secondary: #0a150a;
        --text-primary: #ffffff;
        --text-secondary: rgba(255,255,255,0.6);
        --accent: #0d8b4a;
        --accent-light: #34d399;
        --danger: #ef4444;
        --warning: #f59e0b;
    }

    body.light-mode {
        --bg-primary: #ffffff;
        --bg-secondary: #f3f4f6;
        --text-primary: #1f2937;
        --text-secondary: #6b7280;
    }

    * { 
        font-family: 'Noto Sans Arabic', sans-serif; 
        -webkit-tap-highlight-color: transparent; 
        touch-action: manipulation; 
    }

    html, body { 
        margin: 0; 
        padding: 0; 
        background: var(--bg-secondary); 
        color: var(--text-primary); 
        height: 100%; 
        overflow: hidden; 
        overscroll-behavior-y: none; 
    }

    #app { 
        height: 100vh; 
        width: 100vw; 
        max-width: 430px; 
        margin: 0 auto; 
        position: relative; 
        background: var(--bg-primary); 
        overflow: hidden; 
        display: flex; 
        flex-direction: column; 
    }

    .app-content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        padding: 16px;
        padding-bottom: 100px;
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .app-content::-webkit-scrollbar { display: none; }

    .glass-card { 
        background: rgba(255,255,255,0.06); 
        backdrop-filter: blur(20px); 
        -webkit-backdrop-filter: blur(20px); 
        border: 1px solid rgba(255,255,255,0.08); 
        border-radius: 24px; 
    }

    body.light-mode .glass-card {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .prayer-glow { 
        background: linear-gradient(135deg, #1a5c3a 0%, #0d8b4a 50%, #1a5c3a 100%); 
        box-shadow: 0 0 40px rgba(13,139,74,0.3), inset 0 1px 0 rgba(255,255,255,0.2); 
    }

    .habit-ring { transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .habit-ring.completed { transform: scale(0.95); opacity: 0.7; }

    .check-anim { 
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); 
        width: 32px; 
        height: 32px; 
        border-radius: 50%; 
        border: 2px solid rgba(255,255,255,0.2); 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        flex-shrink: 0; 
    }

    .check-anim.checked { 
        background: var(--accent); 
        border-color: var(--accent); 
        transform: scale(1.1); 
    }

    .check-icon { font-size: 12px; opacity: 0; transition: opacity 0.2s; }
    .check-anim.checked .check-icon { opacity: 1; }

    .bottom-nav { 
        height: 70px; 
        background: rgba(13, 31, 13, 0.95); 
        backdrop-filter: blur(20px); 
        -webkit-backdrop-filter: blur(20px); 
        border-top: 1px solid rgba(255,255,255,0.05); 
        display: flex; 
        justify-content: space-around; 
        align-items: center; 
        padding-bottom: env(safe-area-inset-bottom, 0px); 
        z-index: 100; 
    }

    body.light-mode .bottom-nav {
        background: rgba(255, 255, 255, 0.95);
        border-top: 1px solid #e5e7eb;
    }

    .nav-item { 
        background: none; 
        border: none; 
        color: rgba(255,255,255,0.4); 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        gap: 4px; 
        font-size: 10px; 
        padding: 8px 12px; 
        transition: color 0.3s; 
        cursor: pointer; 
    }

    .nav-item.active { color: var(--accent); }
    .nav-item i { font-size: 20px; }

    body.light-mode .nav-item { color: #9ca3af; }
    body.light-mode .nav-item.active { color: var(--accent); }

    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn { 
        from { opacity: 0; transform: translateY(10px); } 
        to { opacity: 1; transform: translateY(0); } 
    }

    .streak-flame { animation: flame 2s ease-in-out infinite; }
    @keyframes flame { 
        0%,100%{transform:scale(1)} 
        50%{transform:scale(1.15)} 
    }

    .pulse-ring { 
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; 
    }

    @keyframes pulse-ring { 
        0% { transform: scale(0.8); opacity: 0.8; } 
        100% { transform: scale(2); opacity: 0; } 
    }

    .switch { position: relative; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }

    .slider { 
        position: absolute; 
        cursor: pointer; 
        top: 0; 
        left: 0; 
        right: 0; 
        bottom: 0; 
        background-color: rgba(255,255,255,0.1); 
        transition: .4s; 
        border-radius: 28px; 
    }

    .slider:before { 
        position: absolute; 
        content: ""; 
        height: 22px; 
        width: 22px; 
        right: 3px; 
        bottom: 3px; 
        background-color: white; 
        transition: .4s; 
        border-radius: 50%; 
    }

    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(-22px); }

    .verse-card { 
        background: linear-gradient(135deg, rgba(13,139,74,0.15), rgba(26,92,58,0.1)); 
        border: 1px solid rgba(13,139,74,0.2); 
    }

    body.light-mode .verse-card {
        background: #ecfdf5;
        border: 1px solid #34d399;
    }

    .hide-scroll::-webkit-scrollbar { display: none; }

    .haptic { transition: transform 0.1s; }
    .haptic:active { transform: scale(0.96); }

    .garden-cell { 
        aspect-ratio: 1; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        font-size: 18px; 
        border-radius: 8px; 
        background: rgba(255,255,255,0.05); 
        transition: all 0.3s ease;
    }

    .garden-cell:hover { transform: scale(1.1); }

    .quran-font { 
        font-family: 'Amiri', serif; 
        font-size: 1.4rem; 
        line-height: 2.2; 
    }

    body.light-mode .text-white { color: var(--text-primary) !important; }
    body.light-mode .text-white\/50 { color: var(--text-secondary) !important; }
    body.light-mode .text-white\/60 { color: #6b7280 !important; }
    body.light-mode .text-white\/70 { color: #6b7280 !important; }
    body.light-mode .text-white\/80 { color: #4b5563 !important; }
    body.light-mode .text-white\/40 { color: #9ca3af !important; }
    body.light-mode .text-white\/30 { color: #9ca3af !important; }

    .skeleton {
        background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
        background-size: 200% 100%;
        animation: skeleton-loading 1.5s infinite;
    }

    @keyframes skeleton-loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    ::selection { background: rgba(13,139,74,0.3); color: white; }

    button:focus-visible, input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
        }
    }
</style>
</head>
<body>
    <div id="app">
        <div id="toast-container"></div>

        <div class="app-content" id="app-content">
            <div id="page-container"></div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item active" data-route="home">
                <i class="fas fa-home"></i>
                <span>الرئيسية</span>
            </button>
            <button class="nav-item" data-route="habits">
                <i class="fas fa-chart-bar"></i>
                <span>العادات</span>
            </button>
            <button class="nav-item" data-route="athkar">
                <i class="fas fa-pray"></i>
                <span>الأذكار</span>
            </button>
            <button class="nav-item" data-route="social">
                <i class="fas fa-users"></i>
                <span>مجتمعي</span>
            </button>
            <button class="nav-item" data-route="profile">
                <i class="fas fa-user"></i>
                <span>أنا</span>
            </button>
        </div>
    </div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
